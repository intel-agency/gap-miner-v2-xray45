name: CI

on:
  push:
    branches: [development, main]
  pull_request:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # .NET 8 SDK (pinned by global.json, rollForward latestFeature) builds
      # GapMiner.sln; SDK 10 remains for the ReportGenerator dotnet tool used
      # by the coverage-html artifact.
      - name: Setup .NET SDK
        uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          dotnet-version: |
            8.0.x
            10.0.x

      # The aspire workload supplies the DCP/dashboard binaries and the Projects
      # source generator required by GapMiner.AppHost (IsAspireHost / NETSDK1147).
      # Pinned to 8.2.2 — in lockstep with the Aspire.Hosting.AppHost 8.2.2 pin
      # in Directory.Packages.props, per .agents/rules/ci-cd.md (strict version
      # pinning). `--version`/workload-set pinning is NOT viable on SDK 8.0.4xx:
      # the required microsoft.net.workloads pack is not published to nuget.org
      # (install fails and rolls back). So: install advertised, then fail loudly
      # on any drift from the pinned version.
      - name: Install aspire workload (pinned 8.2.2, fail on drift)
        run: |
          dotnet workload install aspire
          dotnet workload list | grep -Eq 'aspire[[:space:]]+8\.2\.2/' || {
            echo "::error::aspire workload is not at the pinned version 8.2.2 - failing to prevent silent drift";
            dotnet workload list;
            exit 1;
          }

      - name: Install markdownlint-cli2
        run: npm install -g markdownlint-cli2@0.22.1

      - name: Install gitleaks
        run: |
          curl -sSL https://github.com/gitleaks/gitleaks/releases/download/v8.21.2/gitleaks_8.21.2_linux_x64.tar.gz \
            | tar xz -C /usr/local/bin gitleaks
          chmod +x /usr/local/bin/gitleaks

      - name: Run validation
        shell: pwsh
        run: ./validation.ps1

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: always()
        with:
          name: coverage-html
          path: coverage-html/
